{% extends "base.html" %}
{% block title %}Error — OrionPaste{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center text-center min-h-[50vh]">
  <div class="max-w-sm w-full">
    <div class="flex items-center justify-center mb-6">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-zinc-800">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">Something went wrong</h1>
    <p class="text-[13px] text-zinc-500 mt-2">{{ error or "An unexpected error occurred. Please try again later." }}</p>
    <a href="/" class="btn-primary mt-8 inline-flex items-center justify-center text-[13px]">
      Return Home
    </a>
  </div>
</div>
{% endblock %}
