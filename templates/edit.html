{% extends "base.html" %}
{% block title %}Edit {{ paste.title or paste.slug }} — OrionPaste{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">Edit paste</h1>
    <p class="text-[13px] text-zinc-500 mt-1.5 font-mono">{{ paste.slug }}</p>
  </div>

  <form method="post" class="space-y-5">
    <!-- Password -->
    <div>
      <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">
        Password <span class="text-red-400/70 font-normal normal-case">*</span>
      </label>
      <input
        name="password"
        type="password"
        required
        class="orion-input w-full"
        placeholder="Enter password to edit"
        autofocus
      />
    </div>

    <!-- Title -->
    <div>
      <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">Title</label>
      <input
        name="title"
        value="{{ paste.title }}"
        class="orion-input w-full"
        autocomplete="off"
      />
    </div>

    <!-- Language -->
    <div>
      <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">Language</label>
      <input
        name="language"
        value="{{ paste.language }}"
        class="orion-input w-full"
        autocomplete="off"
      />
    </div>

    <!-- Content -->
    <div>
      <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">Content</label>
      <textarea
        name="content"
        rows="16"
        class="orion-input w-full font-mono text-[13px] resize-y min-h-[300px]"
        spellcheck="false"
      >{{ paste.content }}</textarea>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 pt-2">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('view_paste', slug=paste.slug) }}" class="btn-secondary inline-flex items-center">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
