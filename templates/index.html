{% extends "base.html" %}
{% block title %}Create paste — OrionPaste{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">Create a paste</h1>
    <p class="text-[13px] text-zinc-500 mt-1.5">Share code, notes, or anything text-based.</p>
  </div>

  <form action="/create" method="post" class="space-y-5">
    <!-- Title -->
    <div>
      <label class="flex items-center gap-2 mb-2.5">
        <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-widest">Title</span>
        <span class="text-[11px] text-zinc-600 font-normal normal-case">optional</span>
      </label>
      <input
        name="title"
        class="orion-input w-full"
        placeholder="e.g. My Python Script"
        autocomplete="off"
      />
    </div>

    <!-- Content -->
    <div>
      <label class="flex items-center gap-2 mb-2.5">
        <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-widest">Content</span>
        <span class="text-[11px] text-red-400/70 font-normal normal-case">*</span>
      </label>
      <textarea
        name="content"
        rows="16"
        class="orion-input w-full font-mono text-[13px] resize-y min-h-[300px]"
        placeholder="Paste your code or text here..."
        required
        spellcheck="false"
      ></textarea>
    </div>

    <!-- Settings Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Language -->
      <div>
        <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">Language</label>
        <input
          name="language"
          class="orion-input w-full"
          placeholder="auto"
          autocomplete="off"
        />
      </div>
      <!-- Expires -->
      <div>
        <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">Expires</label>
        <input
          name="expire_days"
          type="number"
          min="0"
          class="orion-input w-full"
          placeholder="never"
        />
      </div>
      <!-- Password -->
      <div>
        <label class="block text-[11px] font-semibold text-zinc-400 uppercase tracking-widest mb-2.5">Password</label>
        <input
          name="password"
          type="password"
          class="orion-input w-full"
          placeholder="edit only"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 pt-2">
      <button type="submit" class="btn-primary">Create Paste</button>
      <button type="reset" class="btn-secondary">Reset</button>
    </div>
  </form>
</div>
{% endblock %}
