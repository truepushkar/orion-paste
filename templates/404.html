{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center text-center min-h-[50vh]">
  <div class="max-w-sm w-full">
    <div class="flex items-center justify-center mb-6">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-zinc-800">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    </div>
    <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">Not Found</h1>
    <p class="text-[13px] text-zinc-500 mt-2">This paste doesn't exist or has expired.</p>
    <a href="/" class="btn-primary mt-8 inline-flex items-center justify-center text-[13px]">
      Create New Paste
    </a>
  </div>
</div>
{% endblock %}
