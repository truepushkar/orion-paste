{% extends "base.html" %}
{% block title %}404 — Lost in Space{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center text-center min-h-[50vh]">
  <div class="max-w-sm w-full">
    <div class="flex items-center justify-center mb-6">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" class="planet-glow">
        <circle cx="12" cy="12" r="6" fill="rgba(139, 92, 246, 0.25)" stroke="#8b5cf6" stroke-width="1"/>
        <ellipse cx="12" cy="12" rx="10.5" ry="3.4" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1" transform="rotate(-22 12 12)"/>
        <line x1="15" y1="9" x2="9" y2="15" stroke="#8b8ba7" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="9" y1="9" x2="15" y2="15" stroke="#8b8ba7" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">Lost in space</h1>
    <p class="text-[13px] mt-2" style="color: var(--text-muted);">This paste doesn't exist, drifted out of orbit, or has expired.</p>
    <a href="/" class="btn-primary mt-8 inline-flex items-center justify-center text-[13px]">
      Create New Paste
    </a>
  </div>
</div>
{% endblock %}
